version: "3.9"

# ============================================================
# Market Intelligence AI + SME Finance — Docker Compose
# ============================================================

services:

  # ── MongoDB ────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: mi_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mi_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend (Market Intelligence + SME Finance) ────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mi_backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MONGODB_URL: mongodb://mongo:27017/
      REDIS_HOST: redis
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - backend_logs:/var/log/market-intelligence
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Next.js Frontend (Market Dashboard + SME Finance Hub) ──
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: mi_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  mongo_data:
  redis_data:
  backend_logs:

networks:
  default:
    name: market_intelligence_net
