[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html:coverage_html",
    "--cov-fail-under=50",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires running DB/Redis)",
    "critical: Critical safety tests that must always pass",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "alembic/*",
    "*/migrations/*",
    "__init__.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
